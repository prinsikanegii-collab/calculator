<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="calculator">

        <header class="calculator-header">
            <div>
                <p class="subtitle">YOUR PERSONAL</p>
                <h1>Calculator<span>.</span></h1>
            </div>

            <div class="calculator-icon">✦</div>
        </header>

        <section class="display-box">
            <p id="previous-display"></p>
            <input
                type="text"
                id="display"
                value="0"
                readonly
                aria-label="Calculator display"
            >
        </section>

        <section class="buttons">

            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="delete">⌫</button>
            <button class="operator" data-operator="%">%</button>
            <button class="operator" data-operator="/">÷</button>

              <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

           
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

             <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>


            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="calculate">=</button>

        </section>

        <footer>
            <span class="status-dot"></span>
            <p>Designed with ♡ using HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="cal.js"></script>

</body>
</html>
